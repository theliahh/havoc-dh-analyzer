name: build-app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm havoc_analyzer.spec
      - uses: actions/upload-artifact@v4
        with:
          name: HavocAnalyzer-windows
          path: dist/HavocAnalyzer.exe
